<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Interpolations Conference</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&family=Manrope:wght@800&display=swap"
            rel="stylesheet"
        />

        <!-- Step 1–2: minimal boilerplate + full-width 12-col hero grid
         Tweak these custom properties to change layout spacing. -->
        <link rel="stylesheet" href="style.css" />
        <!-- Standard favicons -->
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="interpolations-favicon-32.png?v=2"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="interpolations-favicon-16.png?v=2"
        />

        <!-- iOS home screen -->
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="interpolations-apple-touch-icon.png?v=2"
        />

        <!-- Safari pinned tab (monochrome SVG) -->
        <link
            rel="mask-icon"
            href="interpolations-pinned.svg"
            color="#7cc6bd"
        />

        <!-- Browser UI color on mobile and some desktops -->
        <meta name="theme-color" content="#0E1C2B" />

        <link
            rel="preload"
            as="image"
            href="interpolations-hero-illustration-portal-sorbet.png"
            fetchpriority="high"
        />
        <link
            rel="preload"
            as="image"
            href="interpolations-text-bg-portal-sorbet.png"
        />
        <link
            rel="preload"
            as="image"
            href="interpolations-icon-portal-sorbet.png"
        />
    </head>
    <body>
        <section class="hero" role="region" aria-label="Hero">
            <div class="hero__grid">
                <div class="hero__content">
                    <img
                        class="hero__mark"
                        src="interpolations-icon-portal-sorbet.png"
                        alt="Interpolations icon"
                        decoding="async"
                        width="215"
                        height="215"
                    />

                    <h1 class="hero__logo" aria-label="INTERPOLATIONS">
                        <span class="sr-only">INTERPOLATIONS</span>

                        <!-- Rail keeps the wordmark inside the right 6 columns -->
                        <span class="logo-rail">
                            <span
                                class="hero__logo-mask"
                                aria-hidden="true"
                            ></span>
                        </span>
                    </h1>

                    <p class="hero__kicker">DESIGN + AI CONFERENCE</p>

                    <p class="hero__lede">
                        A day of conversation and inspiration centered around
                        <br />
                        new AI creative tools and processes
                    </p>

                    <p class="hero__date">
                        FRIDAY OCTOBER 24, 2025 • NEW YORK CITY
                    </p>

                    <p class="hero__note">
                        <em>Ticket sales and more details coming soon</em>
                    </p>

                    <div class="hero__actions">
                        <a href="#updates" class="btn btn--cta"
                            >Stay up to date</a
                        >
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
